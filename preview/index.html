<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimeVerse Theme Studio</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui;background:#10101b;color:#f5f5f7}body{margin:0;padding:32px;max-width:1320px;margin-inline:auto}h1{margin-bottom:8px}p{color:#aaa}#controls{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid #555;background:#201e31;color:inherit}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.card{border:1px solid var(--border);background:var(--surface);border-radius:18px;padding:18px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}.swatches{display:flex;gap:8px}.swatches i{width:34px;height:34px;border-radius:50%;border:1px solid #ffffff55}.meta{font-size:12px;color:var(--muted)}.selected{outline:2px solid var(--primary)}#status{min-height:1.5em;color:#a5e9cb}
</style></head><body><h1>AnimeVerse Theme Studio</h1><p>Browse, preview, and select the palettes in the local theme engine. Selecting a theme updates <code>config/theme.json</code> only when using the CLI; this static page is a visual browser.</p><div id="controls"><input id="search" placeholder="Filter themes…"><select id="category"><option value="all">All visual styles</option><option value="anime">Anime-inspired</option><option value="gaming">Gaming / pixel</option><option value="scifi">Sci-fi / futuristic</option><option value="minimal">Elegant / atmospheric</option></select><button id="random">Random preview</button></div><div class="grid" id="grid"></div><p id="status" aria-live="polite"></p><script type="module">
import themes from './themes.json' with { type:'json' };
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),category=document.querySelector('#category');let selected=null;
const groups={anime:['animeverse','phantom-empress','sakura-dreams','demon-slayer','limitless-infinity','king-of-curses','eternal-journey','sun-god-nika','bankai-eclipse','nine-tails-chakra','violet-elegance','control-devil','wings-of-freedom','water-breathing'],gaming:['pixel-arcade','samurai-steel'],scifi:['cyberpunk-tokyo','future-gadget-lab','nebula-noir','mecha-frontier','frostbyte','neon-tokyo'],minimal:['celestial-academy','aurora-borealis','desert-dusk','stellar-marionette']};
function render(){grid.replaceChildren();for(const [id,t] of Object.entries(themes)){if(!id.includes(search.value.toLowerCase())&&!t.label.toLowerCase().includes(search.value.toLowerCase()))continue;if(category.value!=='all'&&!groups[category.value].includes(id))continue;const el=document.createElement('article');el.className='card'+(selected===id?' selected':'');el.style.setProperty('--surface',t.colors.surface);el.style.setProperty('--border',t.colors.border);el.style.setProperty('--primary',t.colors.primary);el.style.setProperty('--muted',t.colors.muted);el.innerHTML=`<div><h2>${t.label}</h2><p class="meta">${id}</p></div><div class="swatches">${t.gradient.map(c=>`<i style="background:${c}"></i>`).join('')}</div><p class="meta">Background ${t.colors.background} · Accent ${t.colors.primary}</p>`;el.addEventListener('click',()=>{selected=id;render();document.querySelector('#status').textContent=`Preview selected: ${id}. Activate with: npm run theme -- set ${id}`;});grid.append(el);}}
search.addEventListener('input',render);category.addEventListener('change',render);document.querySelector('#random').addEventListener('click',()=>{const ids=Object.keys(themes);selected=ids[Math.floor(Math.random()*ids.length)];render();document.querySelector('#status').textContent=`Random preview: ${selected}. Activate with: npm run theme -- set ${selected}`;});render();
</script></body></html>
