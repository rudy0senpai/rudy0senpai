<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-labelledby="footer-title"><title id="footer-title">UNTIL THE NEXT EPISODE…</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF8C32"/><stop offset="50%" stop-color="#FFD166"/><stop offset="100%" stop-color="#493025"/></linearGradient></defs><rect width="1000" height="190" rx="26" fill="#211810"/><rect x="2" y="2" width="996" height="186" rx="24" fill="none" stroke="#735034" stroke-width="2"/><circle cx="930" cy="28" r="110" fill="#FF8C32" opacity=".09"/><rect x="34" y="32" width="7" height="126" rx="4" fill="url(#g)"/><text x="66" y="88" fill="#FFF3E5" font-family="Arial,sans-serif" font-size="36" font-weight="700">UNTIL THE NEXT EPISODE…</text><text x="66" y="128" fill="#C8AF96" font-family="Arial,sans-serif" font-size="17">夢は逃げない。逃げるのはいつも自分だ。  /  Dreams don't run away. It's always the dreamer who does.</text><text x="66" y="151" fill="#FF8C32" font-family="Arial" font-size="14">⭐ Leave a star if you enjoyed exploring my universe.</text><text x="965" y="168" text-anchor="end" fill="#C8AF96" opacity=".7" font-family="Arial" font-size="10" letter-spacing="2">RUDY0SENPAI • ANIMEVERSE</text></svg>